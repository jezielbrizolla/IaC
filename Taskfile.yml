version: '3'

# Camada de verbos do repo. Rode sempre da RAIZ — nenhuma task exige cd.
#   task                  lista tudo
#   task packer:build IMAGE=ubuntu-nginx
#   task packer:test  IMAGE=ubuntu-nginx
#
# Instalar o runner: winget install Task.Task

vars:
  PACKER_DIR: packer

tasks:
  default:
    desc: Lista as tasks disponíveis
    cmds:
      - task --list
    silent: true

  # ---------------------------------------------------------------- setup ---
  setup:
    desc: "Prepara a máquina (Terraform, Packer, Docker, git, SSH) - bloco 0"
    cmds:
      - powershell -ExecutionPolicy Bypass -File automation/setup/setup.ps1

  # --------------------------------------------------------------- packer ---
  packer:init:
    desc: "Baixa os plugins declarados nos templates"
    dir: '{{.PACKER_DIR}}'
    cmds:
      - packer init templates/

  packer:fmt:
    desc: "Formata todos os templates .pkr.hcl"
    dir: '{{.PACKER_DIR}}'
    cmds:
      - packer fmt -recursive templates/

  packer:fmt:check:
    desc: "Falha se algum template não estiver formatado (usado no CI)"
    dir: '{{.PACKER_DIR}}'
    cmds:
      - packer fmt -check -recursive templates/

  packer:validate:
    desc: "Valida todos os templates (ou só um, com IMAGE=nome). Args extras (-var, -var-file) vão depois de -- (só valem com IMAGE=)"
    dir: '{{.PACKER_DIR}}'
    cmds:
      # Sintaxe POSIX: o Task interpreta os comandos com mvdan/sh (shell
      # embutido), não com PowerShell — mesmo no Windows. Por isso nada de
      # Get-ChildItem/Write-Host aqui.
      - |
        if [ -n "{{.IMAGE}}" ]; then
          packer validate {{.CLI_ARGS}} "templates/{{.IMAGE}}.pkr.hcl"
        else
          for tpl in templates/*.pkr.hcl; do
            echo "==> validate $tpl"
            packer validate "$tpl" || exit 1
          done
        fi

  packer:build:
    desc: "Builda uma imagem. Requer IMAGE=<nome do template sem extensão>. Args extras (-var, -var-file) vão depois de --"
    dir: '{{.PACKER_DIR}}'
    preconditions:
      - sh: '[ -n "{{.IMAGE}}" ]'
        msg: "Informe a imagem: task packer:build IMAGE=ubuntu-nginx"
    cmds:
      - packer init "templates/{{.IMAGE}}.pkr.hcl"
      - packer build {{.CLI_ARGS}} "templates/{{.IMAGE}}.pkr.hcl"

  packer:test:
    desc: "Sobe a última imagem buildada e testa via HTTP. Requer IMAGE="
    preconditions:
      - sh: '[ -n "{{.IMAGE}}" ]'
        msg: "Informe a imagem: task packer:test IMAGE=ubuntu-nginx"
    cmds:
      - powershell -ExecutionPolicy Bypass -File automation/test-image.ps1 -Image "{{.IMAGE}}"

  # ------------------------------------------------------------ terraform ---
  tf:fmt:
    desc: "Formata todo o código Terraform"
    cmds:
      - terraform fmt -recursive terraform/

  tf:fmt:check:
    desc: "Falha se algum .tf não estiver formatado (usado no CI)"
    cmds:
      - terraform fmt -check -recursive terraform/

  # ----------------------------------------------------------------- misc ---
  clean:
    desc: "Remove imagens Docker sem tag geradas pelos builds"
    cmds:
      - docker image prune -f

  status:
    desc: "Progresso dos checklists dos labs"
    cmds:
      - powershell -ExecutionPolicy Bypass -File automation/status.ps1

  capstone:build:
    desc: "Roda o pipeline completo do capstone: Packer builda, Terraform sobe"
    cmds:
      - task: packer:build
        vars: { IMAGE: capstone-nginx }
      - terraform -chdir=terraform/stacks/capstone-ponte init
      - terraform -chdir=terraform/stacks/capstone-ponte apply -auto-approve

  capstone:destroy:
    desc: "Destrói o container do capstone (a limpeza de imagem já existe: task clean)"
    cmds:
      - terraform -chdir=terraform/stacks/capstone-ponte destroy -auto-approve
